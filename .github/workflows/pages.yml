name: Demo

# Builds demo/ (the real augur/ folder with LocalStore) and publishes it to
# GitHub Pages. Needs Settings → Pages → Source: "GitHub Actions" once.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      # One artifact per attempt, so "Re-run jobs" doesn't find two and refuse.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
