<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Augur demo</title>
  <meta name="description" content="Try Augur, the one-question feedback module, running for real in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23394293'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #F2F1EC; --surface: #fff; --ink: #1F1C15; --muted: #6B6556; --line: #E4DFD1; --accent: #394293;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: var(--accent); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
    header .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    header .brand small { font-weight: 400; color: var(--muted); }
    header nav { display: flex; gap: 14px; font-size: 14px; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 96px; display: grid; gap: 20px; grid-template-columns: 320px 1fr; align-items: start; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
    .steps h2 { margin: 0 0 4px; font-size: 17px; }
    .steps p.lede { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
    .steps ol { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
    .steps li b { display: block; }
    .steps li span { color: var(--muted); font-size: 14px; }
    .steps .foot { margin: 16px 0 10px; font-size: 13px; color: var(--muted); }
    .tabs { display: flex; gap: 4px; margin-bottom: 14px; }
    .tabs button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
    .tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
    .tabs .spacer { flex: 1; }
    .app label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
    .app input, .app textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #FAF9F5; color: inherit; }
    .app textarea { min-height: 160px; resize: vertical; margin-bottom: 12px; }
    .app input { margin-bottom: 12px; font-weight: 600; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: inherit; cursor: pointer; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .status { font-size: 13px; color: var(--muted); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
