<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Augur demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="description" content="Try Augur in a sample task app. Everything runs in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%234353D9'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #F4F5F7; --surface: #fff; --sunken: #EEF0F3; --ink: #15171C; --muted: #646B78; --faint: #8B919C;
      --line: #E3E6EB; --accent: #4353D9; --accent-ink: #fff;
      --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      /* Augur reads these, so its prompt matches the app */
      --k-bg-raised: #fff; --k-bg-surface: #fff; --k-bg-sunken: #F4F5F7; --k-border: #E3E6EB; --k-border-strong: #CDD2DA;
      --k-text-primary: #15171C; --k-text-secondary: #4A505C; --k-text-tertiary: #8B919C;
      --k-action-fill: #4353D9; --k-on-action-fill: #fff; --k-font-sans: var(--font);
      --k-radius-container: 12px; --k-radius-control: 8px;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--line); }
    header .brand { display: flex; align-items: center; gap: 10px; }
    header .brand small { font-size: 13px; color: var(--muted); padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; }
    header nav { display: flex; gap: 8px; font-size: 13.5px; font-weight: 500; }
    header nav a { text-decoration: none; padding: 6px 10px; border-radius: 8px; color: var(--muted); }
    header nav a:hover { background: var(--sunken); color: var(--ink); }
    header nav a.cta { background: var(--ink); color: #fff; }

    main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 110px; display: grid; gap: 24px; grid-template-columns: 280px 1fr; align-items: start; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 20px 16px 110px; } header { padding: 0 16px; } header nav a:not(.cta) { display: none; } }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }

    .steps { padding: 20px; position: sticky; top: 20px; }
    .steps h2 { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
    .steps .lede { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
    .steps ol { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 14px; counter-reset: s; }
    .steps li { display: grid; grid-template-columns: 24px 1fr; column-gap: 10px; counter-increment: s; }
    .steps li::before { content: counter(s); grid-row: span 2; width: 22px; height: 22px; border-radius: 50%; background: var(--sunken); color: var(--ink); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
    .steps li b { font-weight: 600; }
    .steps li span { color: var(--muted); font-size: 13.5px; }

    .tabs { display: inline-flex; gap: 2px; padding: 3px; margin-bottom: 14px; background: var(--sunken); border-radius: 10px; }
    .tabs button { padding: 6px 14px; border-radius: 8px; border: 0; background: none; color: var(--muted); font-weight: 500; cursor: pointer; }
    .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(16,24,40,.08); }
    .card.admin { padding: 20px; }

    .btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; cursor: pointer; }
    .btn:hover { background: var(--sunken); }

    .app { padding: 0; overflow: hidden; }
    .app-hd { display: flex; align-items: baseline; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .app-hd b { font-size: 15px; font-weight: 650; }
    .app-hd span { color: var(--faint); font-size: 13px; }
    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 16px; background: #FAFAFB; }
    @media (max-width: 700px) { .board { grid-template-columns: 1fr; } .col { min-height: 0; } }
    .col { background: var(--sunken); border-radius: 12px; padding: 10px; min-height: 300px; display: flex; flex-direction: column; gap: 8px; }
    .col h3 { margin: 2px 4px 4px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    .col h3 span { font-weight: 500; color: var(--faint); }
    .task { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: grab; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
    .task:active { cursor: grabbing; }
    .task p { margin: 0 0 10px; font-weight: 500; }
    .task.is-done p { color: var(--faint); text-decoration: line-through; }
    .task-ft { display: flex; align-items: center; gap: 8px; }
    .tag { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 99px; background: #EEF0FB; color: #3A46B8; }
    .who { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; background: #E8EBF0; color: var(--muted); font-size: 10.5px; font-weight: 650; display: grid; place-items: center; }
    .assign { margin-left: auto; padding: 2px 9px; font-size: 12.5px; font-weight: 500; color: var(--muted); border: 1px dashed #C4C9D2; border-radius: 99px; background: none; cursor: pointer; }
    .assign:hover { color: var(--ink); border-color: var(--faint); }
    .mv { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; line-height: 1; }
    .mv:hover { color: var(--ink); background: var(--sunken); }
    .add { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
    .add input { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
